name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --extra dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --extra dev pytest -q
      - name: CLI smoke test
        run: |
          uv run sotto --version
          uv run sotto --help

  test-windows:
    # Mirrors the Windows installer build in release.yml, so a change that
    # breaks the EXE's imports fails here before a release does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Import smoke test
        run: python -c "import sotto.winapp, sotto.injector, sotto.__main__; print('imports OK')"
