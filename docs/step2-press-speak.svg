<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <clipPath id="canvas2"><rect width="760" height="420" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#canvas2)">
    <rect width="760" height="420" fill="#17171c"/>
    <circle cx="640" cy="380" r="220" fill="#1f1b2e" opacity="0.6"/>
    <circle cx="90" cy="60" r="160" fill="#16222b" opacity="0.6"/>

    <!-- app window (mail compose) -->
    <g>
      <rect x="70" y="46" width="620" height="270" rx="12" fill="#26262e" stroke="#3d3d47"/>
      <circle cx="94" cy="68" r="6" fill="#ff5f57"/>
      <circle cx="114" cy="68" r="6" fill="#febc2e"/>
      <circle cx="134" cy="68" r="6" fill="#28c840"/>
      <text x="380" y="73" font-size="13" fill="#8a8a95" text-anchor="middle">New Message</text>
      <line x1="70" y1="88" x2="690" y2="88" stroke="#3d3d47"/>

      <text x="94" y="114" font-size="13" fill="#8a8a95">To:</text>
      <rect x="122" y="100" width="92" height="20" rx="10" fill="#3a3a44"/>
      <text x="134" y="114" font-size="12" fill="#d5d5dc">Alex Liu</text>
      <line x1="70" y1="130" x2="690" y2="130" stroke="#33333c"/>
      <text x="94" y="154" font-size="13" fill="#8a8a95">Subject:  Thursday sync</text>
      <line x1="70" y1="166" x2="690" y2="166" stroke="#33333c"/>

      <!-- empty body with blinking cursor -->
      <rect x="94" y="188" width="2.5" height="18" fill="#a99bff"/>
      <text x="106" y="203" font-size="13" fill="#5c5c66">Cursor in any text field — press the key once and talk</text>
    </g>

    <!-- floating Sotto capsule -->
    <g>
      <rect x="270" y="336" width="220" height="40" rx="20" fill="#101014" stroke="#3d3d47"/>
      <circle cx="296" cy="356" r="6" fill="#ff453a"/>
      <text x="312" y="361" font-size="14" fill="#ffffff">Listening… 中文</text>
      <!-- waveform -->
      <g fill="#a99bff">
        <rect x="408" y="350" width="4" height="12" rx="2"/>
        <rect x="416" y="345" width="4" height="22" rx="2"/>
        <rect x="424" y="348" width="4" height="16" rx="2"/>
        <rect x="432" y="343" width="4" height="26" rx="2"/>
        <rect x="440" y="349" width="4" height="14" rx="2"/>
        <rect x="448" y="346" width="4" height="20" rx="2"/>
      </g>
    </g>

    <!-- key cap -->
    <g>
      <rect x="560" y="330" width="120" height="52" rx="10" fill="#2e2e37" stroke="#4a4a55" stroke-width="1.5"/>
      <rect x="560" y="334" width="120" height="52" rx="10" fill="#26262e" stroke="#4a4a55" stroke-width="1.5"/>
      <text x="620" y="356" font-size="14" fill="#e8e8ec" text-anchor="middle">F13  中文</text>
      <text x="620" y="374" font-size="10" fill="#8a8a95" text-anchor="middle">PRESS ONCE — NO HOLDING</text>
    </g>

    <!-- speech bubble -->
    <g>
      <rect x="80" y="336" width="178" height="40" rx="12" fill="#26262e" stroke="#3d3d47"/>
      <text x="96" y="353" font-size="12" fill="#b9b9c2">🗣 “um, set up a sync with</text>
      <text x="96" y="369" font-size="12" fill="#b9b9c2">Alex, uh, on Thursday…”</text>
    </g>
  </g>
</svg>
