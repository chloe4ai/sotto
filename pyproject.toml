[project]
name = "sotto"
version = "0.1.0"
description = "Speak softly, never type. Privacy-first AI voice dictation for macOS — hold a key, speak, get polished text in any app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Chloe Tan" }]
keywords = ["dictation", "voice", "speech-to-text", "whisper", "macos"]
dependencies = [
    "rumps>=0.4.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "faster-whisper>=1.0.0",
    "pyobjc-framework-Cocoa>=10.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sotto = "sotto.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotto"]
